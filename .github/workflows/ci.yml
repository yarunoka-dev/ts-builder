name: ci

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor of the supported range; grow the matrix as new
        # majors appear
        node: ['26']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # --ignore-scripts keeps dependency lifecycle scripts from running
      # in CI (ops docs/security.md)
      - name: Install dependencies from lock file
        run: npm ci --ignore-scripts

      - name: Check code style and lints
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test
