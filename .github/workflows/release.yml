name: release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

jobs:
  # Building needs a checkout, so this job holds no write scope; the
  # publish and release jobs below never execute repository code.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: npm

      # --ignore-scripts keeps dependency lifecycle scripts from running
      # in CI (ops docs/security.md)
      - name: Install dependencies from lock file
        run: npm ci --ignore-scripts

      # npm publishes whatever package.json declares, so a tag on a tree
      # that declares a different version would ship a package that
      # contradicts the release it came from.
      - name: Verify the tag matches the declared package version
        run: |
          declared="$(node -p "require('./package.json').version")"
          if [ "$declared" != "$GITHUB_REF_NAME" ]; then
            echo "package.json declares $declared but the tag is $GITHUB_REF_NAME"
            exit 1
          fi

      # prepack builds dist before the tarball is assembled
      - name: Pack the publishable tarball
        run: npm pack

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package
          path: yarunoka-builder-*.tgz
          if-no-files-found: error

  # No checkout: the job publishes the tarball built above, so the job
  # holding the OIDC identity never executes repository code. Trusted
  # publishing needs no long-lived secret; the environment adds the
  # GitHub-side rule that only tag-started runs may claim it, which the
  # npm side verifies through the trusted publisher's environment field.
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      id-token: write
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package

      - name: Publish to npm with provenance
        run: npm publish yarunoka-builder-*.tgz --provenance --access public

  # No checkout: gh operates on the remote repository directly, so the
  # job never executes repository code with a write-scoped token.
  release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create GitHub release with generated notes
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}

  # The website reads docs from released tags only, so every release must
  # rebuild it. The cross-repo call authenticates as the org's GitHub App —
  # its installation token is short-lived and scoped to the website
  # repository, and this job holds no GITHUB_TOKEN permissions at all.
  # The environment adds a deployment review: the job waits for an approval
  # before it starts, and the App's private key lives in the environment's
  # secrets, so no job outside this gate can read it.
  rebuild-website:
    needs: release
    runs-on: ubuntu-latest
    environment: website-rebuild
    permissions: {}
    steps:
      - name: Mint an installation token for the website
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.WEBSITE_DISPATCH_APP_ID }}
          private-key: ${{ secrets.WEBSITE_DISPATCH_APP_PRIVATE_KEY }}
          owner: yarunoka-dev
          repositories: website

      - name: Trigger the website rebuild
        run: >
          gh api "repos/yarunoka-dev/website/dispatches"
          -f event_type=docs-release
          -f "client_payload[repo]=$GITHUB_REPOSITORY"
          -f "client_payload[tag]=$GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
